# Publishes this n8n community node package to npm on every version tag push.
#
# From May 1 2026 n8n requires community nodes to be published from GitHub
# Actions with an npm provenance statement. This workflow does that: the
# statement lets anyone verify that the package was built by this workflow,
# from this repository and commit. Do not publish from a local machine.
#
# Requirements
#   @n8n/node-cli 0.23.0 or later (the repository pins a newer release).
#
# One-time setup, option A (recommended, no long-lived secret):
#   1. On npmjs.com open the package settings, section Trusted Publisher.
#   2. Choose GitHub Actions and enter the repository owner, the repository
#      name and the workflow file name publish.yml. Leave Environment empty.
#   3. Leave the NPM_TOKEN repository secret unset.
#
# One-time setup, option B (fallback):
#   1. On npmjs.com create a Granular Access Token with read and write access
#      to this package only.
#   2. In the repository settings add it as the Actions secret NPM_TOKEN.
#
# Releasing
#   Run `npm run release` on your machine. It lints, builds, asks for the
#   version, updates CHANGELOG.md, commits, tags and pushes. The tag push
#   starts this workflow, which publishes the package.
#
# Tags look like 0.2.0. For a "v" prefix (v0.2.0) change the filter below to
# 'v*.*.*'.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Needed to mint the OIDC token used for the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run tests
        run: 'npm test'

      - name: Release
        # Lint and build run as part of the release. With option A the token
        # step is skipped and npm uses the OIDC exchange.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
